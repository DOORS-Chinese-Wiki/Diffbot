# DiffBot — Docker Compose 部署（Linux）
# 用法：
#   1. 复制 config.example.yaml 为 config.yaml，填写 bot_uin / root / ws_token
#   2. 在 .env 中设置 QQ_ACCOUNT（NapCat 登录的 QQ 号）
#   3. docker compose up -d
#   4. 首次登录：docker compose logs -f napcat 扫码
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    environment:
      - ACCOUNT=${QQ_ACCOUNT}
      - NAPCAT_GID=0
      - NAPCAT_UID=0
    volumes:
      - ./napcat:/app/napcat
    restart: unless-stopped
    init: true

  diffbot:
    build: .
    container_name: diffbot
    depends_on:
      - napcat
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      # - DIFFBOT_ADMINS=10001,10002
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
